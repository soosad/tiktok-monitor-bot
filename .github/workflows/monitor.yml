name: TikTok Monitor Bot

on:
  schedule:
    # 調整為每 4 小時自動執行一次
    - cron: '0 */4 * * *'
  workflow_dispatch: # 允許在 GitHub 頁面手動點擊觸發

permissions:
  contents: write # 必須開啟寫入權限，才能將 sent_history.txt 與 topics_map.json 推回倉庫

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create cookies.txt from Secret
        run: |
          # 將 GitHub Secret 中的 Cookie還原為 cookies.txt
          printf "%s" "${{ secrets.TIKTOK_COOKIES }}" > cookies.txt

      - name: Run monitor script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python monitor.py

      - name: Clean up cookies.txt
        if: always()
        run: |
          # 執行完畢後刪除暫存的 cookie 檔案，保護帳號安全
          rm -f cookies.txt

      - name: Commit and push updated history and topics
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.io"
          
          # 先將本地變動暫存，避免 pull --rebase 時發生衝突中斷
          git stash || true
          git pull --rebase
          git stash pop || true
          
          git add sent_history.txt topics_map.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update sent history and topics map" && git push)
